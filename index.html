<style>
:root {
  --primary: #6C5CE7;
  --primary-light: #A29BFE;
  --primary-dark: #5A4BD1;
  --secondary: #00CEC9;
  --accent: #FD79A8;
  --accent-warm: #FDCB6E;
  --success: #00B894;
  --text-primary: #16162a;
  --text-secondary: #4a4a68;
  --text-tertiary: #7a7a95;
  --bg-primary: #FAFBFF;
  --bg-secondary: #F3F4FB;
  --white: #ffffff;
  --border: rgba(108, 92, 231, 0.1);
  --shadow-sm: 0 2px 8px rgba(16, 16, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(16, 16, 42, 0.08);
  --shadow-lg: 0 20px 48px rgba(16, 16, 42, 0.12);
  --shadow-xl: 0 32px 80px rgba(16, 16, 42, 0.16);
  --gradient-primary: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
  --gradient-warm: linear-gradient(135deg, #FD79A8 0%, #FDCB6E 100%);
  --gradient-cool: linear-gradient(135deg, #6C5CE7 0%, #00CEC9 100%);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  background: var(--bg-primary);
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: var(--text-primary); }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img, svg { max-width: 100%; display: block; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }

::selection { background: var(--primary); color: white; }

/* Ambient background orbs */
.ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: float 20s ease-in-out infinite; }
.orb-1 { width: 500px; height: 500px; background: var(--primary); top: -200px; left: -100px; }
.orb-2 { width: 400px; height: 400px; background: var(--secondary); top: 40%; right: -150px; animation-delay: -7s; }
.orb-3 { width: 450px; height: 450px; background: var(--accent); bottom: -200px; left: 30%; animation-delay: -14s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.05); }
  66% { transform: translate(-20px, 20px) scale(0.95); }
}

/* Scroll progress */
.scroll-progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gradient-primary); z-index: 1000; width: 0%; transition: width 0.1s linear; }

/* Container */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 15px; transition: all 0.3s var(--ease-out); white-space: nowrap; }
.btn-primary { background: var(--gradient-primary); color: white; box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(108, 92, 231, 0.4); }
.btn-secondary { background: white; color: var(--text-primary); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.btn-secondary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary-light); }
.btn-large { padding: 18px 36px; font-size: 16px; border-radius: 14px; }

/* Navbar */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 20px 0; transition: all 0.3s var(--ease-out); }
.navbar.scrolled { background: rgba(250, 251, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); padding: 14px 0; }
.nav-wrapper { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; }
.logo-mark { width: 36px; height: 36px; background: var(--gradient-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
.nav-links { display: flex; align-items: center; gap: 36px; }
.nav-links a { font-size: 14px; font-weight: 500; color: var(--text-secondary); transition: color 0.2s; }
.nav-links a:hover { color: var(--primary); }
.nav-cta { display: flex; align-items: center; gap: 12px; }
.mobile-toggle { display: none; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 10px; color: var(--text-primary); }

/* Mobile menu */
.mobile-menu { position: fixed; inset: 0; background: rgba(250, 251, 255, 0.98); backdrop-filter: blur(20px); z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.mobile-menu.active { opacity: 1; pointer-events: auto; }
.mobile-menu a { font-size: 24px; font-weight: 700; color: var(--text-primary); }

/* Hero */
.hero { padding: 160px 0 100px; position: relative; }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: white; border: 1px solid var(--border); border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--primary); box-shadow: var(--shadow-sm); margin-bottom: 24px; }
.hero-badge-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.hero h1 { font-size: clamp(40px, 6vw, 68px); margin-bottom: 24px; }
.hero h1 .highlight { background: var(--gradient-cool); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-subtitle { font-size: 19px; color: var(--text-secondary); margin-bottom: 36px; max-width: 540px; }
.hero-actions { display: flex; gap: 16px; margin-bottom: 36px; flex-wrap: wrap; }
.hero-trust { display: flex; align-items: center; gap: 24px; font-size: 13px; color: var(--text-tertiary); }
.trust-avatars { display: flex; }
.trust-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid white; background: var(--gradient-primary); margin-left: -8px; display: flex; align-items: center; justify-content: center; color: white; }
.trust-avatar:first-child { margin-left: 0; }
.trust-avatar:nth-child(2) { background: var(--gradient-warm); }
.trust-avatar:nth-child(3) { background: var(--gradient-cool); }
.trust-avatar:nth-child(4) { background: linear-gradient(135deg, var(--secondary), var(--primary-light)); }

/* Hero visual */
.hero-visual { position: relative; }
.hero-card { background: white; border-radius: 24px; padding: 32px; box-shadow: var(--shadow-xl); position: relative; }
.hero-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.hero-card-avatar { width: 48px; height: 48px; background: var(--gradient-warm); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
.hero-card-info h4 { font-size: 15px; }
.hero-card-info p { font-size: 13px; color: var(--text-tertiary); }
.progress-bar { height: 8px; background: var(--bg-secondary); border-radius: 100px; overflow: hidden; margin-bottom: 24px; }
.progress-fill { height: 100%; width: 72%; background: var(--gradient-cool); border-radius: 100px; animation: progressGrow 2s var(--ease-out); }
@keyframes progressGrow { from { width: 0; } to { width: 72%; } }
.subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.subject-card { padding: 16px; background: var(--bg-secondary); border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: transform 0.3s; }
.subject-card:hover { transform: translateY(-2px); }
.subject-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
.subject-icon.math { background: var(--primary); }
.subject-icon.science { background: var(--secondary); }
.subject-icon.reading { background: var(--accent); }
.subject-icon.art { background: var(--accent-warm); }
.subject-info h5 { font-size: 13px; }
.subject-info p { font-size: 11px; color: var(--text-tertiary); }
.achievement { display: flex; align-items: center; gap: 12px; padding: 14px; background: linear-gradient(135deg, rgba(253, 203, 110, 0.1), rgba(253, 121, 168, 0.1)); border-radius: 12px; }
.achievement-icon { width: 36px; height: 36px; background: var(--gradient-warm); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
.achievement-text { font-size: 13px; font-weight: 600; }

.floating-badge { position: absolute; background: white; padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.floating-badge-1 { top: 20px; right: -20px; animation: floatBadge 4s ease-in-out infinite; }
.floating-badge-2 { bottom: 40px; left: -30px; animation: floatBadge 4s ease-in-out infinite; animation-delay: -2s; }
@keyframes floatBadge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.badge-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }

/* Social Proof */
.social-proof { padding: 80px 0 60px; }
.social-proof-label { text-align: center; font-size: 13px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 32px; }
.logos-grid { display: flex; justify-content: center; align-items: center; gap: 48px; flex-wrap: wrap; opacity: 0.6; margin-bottom: 60px; }
.logo-item { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--text-secondary); }
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
.metric { text-align: center; }
.metric-value { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 44px; font-weight: 800; background: var(--gradient-cool); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; margin-bottom: 8px; }
.metric-label { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

/* Section */
.section { padding: 100px 0; }
.section-header { text-align: center; max-width: 680px; margin: 0 auto 64px; }
.section-badge { display: inline-block; padding: 6px 14px; background: rgba(108, 92, 231, 0.1); color: var(--primary); border-radius: 100px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
.section-title { font-size: clamp(32px, 4vw, 48px); margin-bottom: 16px; }
.section-subtitle { font-size: 18px; color: var(--text-secondary); }

/* Features */
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.feature-card { background: white; padding: 32px; border-radius: 20px; border: 1px solid var(--border); transition: all 0.4s var(--ease-out); position: relative; overflow: hidden; }
.feature-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.feature-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-primary); transform: scaleX(0); transform-origin: left; transition: transform 0.4s var(--ease-out); }
.feature-card:hover::before { transform: scaleX(1); }
.feature-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 20px; }

.feature-card h3 { font-size: 20px; margin-bottom: 12px; }
.feature-card p { color: var(--text-secondary); font-size: 15px; }

.showcase { padding: 100px 0; background: var(--bg-secondary); border-radius: 32px; margin: 0 24px; }
.showcase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1152px; margin: 0 auto; padding: 0 24px; }

.showcase-visual { background: white; border-radius: 20px; padding: 24px; box-shadow: var(--shadow-xl); }
.browser-chrome { display: flex; align-items: center; gap: 6px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.browser-chrome span { width: 12px; height: 12px; border-radius: 50%; background: #ddd; }
.browser-chrome span:nth-child(1) { background: #ff5f57; }

.lesson-item { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--bg-secondary); border-radius: 12px; margin-bottom: 10px; }

/* Benefits */
.benefits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }

/* Testimonials */

.ta3 { background: var(--gradient-cool); }
.testimonial-info h5 { font-size: 14px; margin-bottom: 2px; }
.testimonial-info p { font-size: 12px; color: var(--text-tertiary); }
